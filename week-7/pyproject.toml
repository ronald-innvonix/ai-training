[project]
name = "langgraph-practice"
version = "0.1.0"
description = "Practice project: connecting LangChain agents to MCP servers"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-groq>=1.1.3",
    "langchain>=1.4.1",
    "python-dotenv>=1.0.1",
    "mcp-server-fetch>=2025.1.14",
    "mcp-server-git>=2025.1.14",
    "jupyterlab~=4.6",
    "notebook~=7.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-practicals"
version = "1.0.0"
description = "Week 2 LangChain practicals: prompt templates, model invocation methods, and structured review analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Training - Week 2" }]
keywords = ["langchain", "llm", "groq", "mistral", "gemini", "structured-output"]
dependencies = [
    "langchain==1.3.15",
    "langchain-core==1.6.0",
    "langchain-groq==1.1.3",
    "langchain-mistralai==1.1.6",
    "langchain-google-genai==4.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
langchain-practicals = "langchain_practicals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_practicals"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

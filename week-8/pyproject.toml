[project]
name = "week-8"
version = "0.1.0"
description = "LangGraph Learning Lab: Persistence, Human-in-the-Loop & Subgraphs"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-groq>=1.1.3",
    "langchain>=1.4.1",
    "python-dotenv>=1.0.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "jupyterlab~=4.6",
    "notebook~=7.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"